name: Security CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  semgrep_scan:
    name: semgrep/ci
    runs-on: ubuntu-latest
    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')
    permissions:
      # required for all workflows
      security-events: write
      # only required for workflows in private repositories
      actions: read
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit
  pip_audit_scan:
    name: pip-audit/ci
    runs-on: ubuntu-latest
    if: (github.actor != 'dependabot[bot]')
    permissions:
      security-events: write
      actions: read
      contents: read  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  
      - name: Install pip-audit and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt  
      - name: Run pip-audit Scan
        run: |
          pip-audit -r requirements.txt
  trivy_scan:
    name: trivy/ci
    runs-on: ubuntu-latest
    if: (github.actor != 'dependabot[bot]')
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: 1

  gitsecrets_scan:
    name: git-secrets/ci
    runs-on: ubuntu-latest
    if: (github.actor != 'dependabot[bot]')
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install git-secrets
        run: |
          sudo apt-get update
          sudo apt-get install -y git-secrets

      - name: Run git-secrets Scan
        run: |
          git secrets --scan -r .
  dast-zap:
    name: OWASP_ZAP/ci
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask app
        working-directory: .
        run: |
          nohup python app.py > flask.log 2>&1 &
          sleep 5
          cat flask.log

      - name: Verify Flask app is running
        run: |
          curl http://127.0.0.1:5000/openapi.json | head
      - name: Initialize test data
        run: |
          curl -f http://127.0.0.1:5000/createdb
          curl -f http://127.0.0.1:5000/users/v1 | head

      - name: Run OWASP ZAP API Scan
        run: |
          docker run --user root --network=host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t http://127.0.0.1:5000/openapi.json \
            -f openapi \
            -r zap-report.html \
            -I

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-report
          path: zap-report.html
          retention-days: 7

      - name: Upload Flask log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flask-runtime-log
          path: flask.log
          retention-days: 7
